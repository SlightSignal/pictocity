services:
  pictocity:
    build: .
    ports: ["4100:4100"]
    volumes:
      - pictocity-data:/app/data
      - ./fonts:/app/fonts:ro
      - ./image-tools.json:/app/image-tools.json:ro
    environment:
      PICTOCITY_TOKEN: ""   # set a secret to require Authorization: Bearer on the API and WebSocket
volumes:
  pictocity-data:
